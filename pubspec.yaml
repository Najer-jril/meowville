name: meowville
description: "platform penitipan kucing all role"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/cats/
    - assets/images/rooms/
    - assets/images/users/
    - assets/images/payments/
    - assets/icons/
    - assets/svg/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#C76543"
  adaptive_icon_foreground: "assets/icons/icon.png"
